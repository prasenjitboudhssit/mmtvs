<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: white;
        }

        .hero h1 {
            font-size: 50px;
        }

        .hero p {
            font-size: 20px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #111;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h2>My Website</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to My Website</h1>

    <p>This website is hosted completely free using GitHub Pages.</p>

    <a class="button" href="#about">Learn More</a>
</section>

<section id="about" style="padding: 60px 20px; text-align: center;">
    <h2>About Me</h2>

    <p>
        Hello! This is my first website created with HTML
        and hosted on GitHub Pages.
    </p>
</section>

<section id="contact" style="padding: 60px 20px; text-align: center;">
    <h2>Contact</h2>

    <p>Email: example@email.com</p>
</section>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
